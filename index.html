<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>給你 💗</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang TC","Microsoft JhengHei",sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;transition:.5s;overflow:hidden}
body.blue{background:#AEDFF5}
body.pink{background:#FFD6E7}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:0;display:flex;justify-content:space-between;padding:0 12px}
.hearts span{font-size:18px;opacity:.7;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.card{background:#fff;width:100%;max-width:380px;border-radius:28px;padding:28px 22px;text-align:center;position:relative;z-index:1;box-shadow:0 15px 35px rgba(0,0,0,.12)}
.icon{font-size:48px;margin-bottom:12px}
h1{font-size:24px;margin-bottom:8px;color:#1E4A7A}
.pink h1{color:#E84A7A}
p{color:#666;font-size:15px;line-height:1.6}
input{width:100%;padding:14px;border:2px solid #AEDFF5;border-radius:14px;font-size:18px;text-align:center;outline:none;margin:16px 0 12px}
.btn{width:100%;padding:14px;border:none;border-radius:999px;font-size:18px;font-weight:700;color:#fff;cursor:pointer;background:#2E86DE}
.pink .btn{background:#FF6FA5}
.big{font-size:52px;font-weight:900;color:#FF2E7A;margin:10px 0}
.msg{background:#FFE3EE;border-radius:16px;padding:12px;color:#8A1A3A;font-size:14px;margin-top:12px}
.photo{width:150px;height:150px;border-radius:50%;background:#FFD6E7;display:flex;align-items:center;justify-content:center;font-size:60px;margin:14px auto;border:5px solid #FFD6E7;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:12px;margin-top:18px}
.row button{flex:1;padding:14px;border:none;border-radius:999px;font-size:20px;font-weight:800;color:#fff;cursor:pointer}
#yesBtn{background:#FF9EBD}
#noBtn{background:#B0B0B0}
.next{position:absolute;right:16px;bottom:-18px;width:44px;height:44px;border-radius:50%;background:#FF9EBD;color:#fff;border:none;font-size:22px;cursor:pointer}
.back{margin-top:16px;background:#eee;border:none;padding:8px 18px;border-radius:999px;color:#777}
.flowers{position:absolute;font-size:26px}
.hidden{display:none}
</style>
</head>
<body class="blue">
<div class="hearts"><span>💙🤍💙🤍💙</span><span>💙🤍💙🤍💙</span></div>

<div class="card" id="page1">
<div class="icon">🔒</div>
<h1>輸入我們的專屬密碼</h1>
<p>只有你知道的喔</p>
<input type="password" id="pw" placeholder="••••" inputmode="numeric">
<button class="btn" onclick="checkPw()">進入</button>
<p id="err" style="color:#FF2E7A;margin-top:8px"></p>
</div>

<div class="card pink hidden" id="page2">
<div class="icon">💗</div>
<h1>我們在一起</h1>
<div class="photo">💑</div>
<p>從11月12日到今天</p>
<div class="big" id="days">6 天啦</div>
<div class="msg">在一起的每一天，<br>都是甜蜜的小日常 ♡</div>
<button class="next" onclick="go3()">→</button>
</div>

<div class="card hidden" id="page3">
<div class="icon">💙</div>
<h1>我們會一直在一起嗎&gt;&lt;</h1>
<div class="row">
<button id="yesBtn" onclick="go4()">Yes</button>
<button id="noBtn" onclick="noClick()">No</button>
</div>
<button class="back" onclick="back2()">← Back</button>
</div>

<div class="card pink hidden" id="page4">
<span class="flowers" style="top:8px;left:12px">🌸🌷</span>
<span class="flowers" style="top:8px;right:12px">🌷🌸</span>
<span class="flowers" style="bottom:8px;left:12px">🌸🌷</span>
<span class="flowers" style="bottom:8px;right:12px">🌷🌸</span>
<div class="icon">🌹</div>
<h1 style="font-size:38px">I Love you 💗</h1>
<p style="margin:14px 0">我們會一直在一起的，對吧？</p>
<p style="font-size:20px;color:#E84A7A;font-weight:700">送你一束花</p>
</div>

<script>
function checkPw(){
  if(document.getElementById('pw').value==='1112'){
    document.getElementById('page1').classList.add('hidden');
    document.getElementById('page2').classList.remove('hidden');
    document.body.className='pink';
  } else {
    document.getElementById('err').innerText='密碼不對喔，再想想 💭';
  }
}
let start=new Date('2026-11-12');
let now=new Date();
let diff=Math.floor((now-start)/(1000*60*60*24))+1;
document.getElementById('days').innerText=diff+' 天啦';
function go3(){
  document.getElementById('page2').classList.add('hidden');
  document.getElementById('page3').classList.remove('hidden');
  document.body.className='blue';
}
function back2(){
  document.getElementById('page3').classList.add('hidden');
  document.getElementById('page2').classList.remove('hidden');
  document.body.className='pink';
}
let noCount=0;
function noClick(){
  noCount++;
  let yes=document.getElementById('yesBtn');
  let size=20+noCount*10;
  yes.style.fontSize=size+'px';
  yes.style.padding=(14+noCount*4)+'px';
  if(noCount>=3){
    go4();
  }
}
function go4(){
  document.getElementById('page3').classList.add('hidden');
  document.getElementById('page4').classList.remove('hidden');
  document.body.className='pink';
}
</script>
</body>
</html>
